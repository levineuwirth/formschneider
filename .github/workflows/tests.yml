# make test. It needs potrace and rsvg-convert from the system, the fonts
# fonts.json lists, and levineuwirth.org's EB Garamond set, and fails if any
# test skips for want of one (tests/conftest.py).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: potrace, rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends potrace librsvg2-bin
      - name: levineuwirth.org's EB Garamond set
        uses: actions/checkout@v7
        with:
          repository: levineuwirth/levineuwirth.org
          path: site
          sparse-checkout: static/initials
      - run: echo "FORMSCHNEIDER_SITE_SET=$GITHUB_WORKSPACE/site/static/initials/eb-garamond" >> "$GITHUB_ENV"
      # setup-uv publishes exact versions only; PyPI's uv is always the current one
      - name: uv
        run: pipx install uv
      # EB Garamond Initials from CTAN, Spectral from the Google Fonts revision
      # the site pins, each checked against fonts.json
      - name: Fonts
        run: uv run bin/fonts
      - name: Tests
        run: make test
